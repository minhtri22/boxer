<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Boxer P0 — P1 Web UAT</title>
  <link rel="icon" type="image/x-icon" href="TemplateData/favicon.ico?v=w1-7c68a607ac4217e06d222fc75d2dd5e3c64ad178">
  <link rel="stylesheet" href="TemplateData/style.css">
</head>
<body>
  <div id="gate">
    <div class="panel">
      <h1>BOXER P1</h1>
      <p id="status">Enable Motion for head control. Footwork and punches must remain usable even if Safari orientation is delayed.</p>
      <button id="enable">ENABLE MOTION &amp; OPEN HOME</button>
      <p class="small">Hold the phone in a comfortable neutral portrait position while starting. The first orientation sample becomes the neutral head angle automatically.</p>
    </div>
  </div>
  <div id="unity-container" class="hidden">
    <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
  </div>
  <section id="ring-intro" class="hidden" aria-label="Round introduction">
    <!-- Coach/practice must not start an unused background video transfer. play() loads it for the real intro. -->
    <video id="ring-video" playsinline muted preload="none" disablepictureinpicture></video>
    <div class="ring-caption">
      <p id="ring-status" role="status">ROUND 1</p>
      <button id="ring-retry" class="hidden">PHÁT GIỚI THIỆU / BẬT ÂM THANH</button>
      <button id="ring-back">QUAY LẠI</button>
    </div>
  </section>
  <script src="TemplateData/ring-media.js?v=w1-7c68a607ac4217e06d222fc75d2dd5e3c64ad178"></script>
  <script src="TemplateData/fighter-profile.js?v=w1-7c68a607ac4217e06d222fc75d2dd5e3c64ad178"></script>
  <script>
    const gate = document.getElementById('gate');
    const statusEl = document.getElementById('status');
    const enableButton = document.getElementById('enable');
    const container = document.getElementById('unity-container');
    const canvas = document.getElementById('unity-canvas');
    const desktopValidation = new URLSearchParams(location.search).get('desktop') === '1';
    if (desktopValidation) {
      enableButton.textContent = 'START DESKTOP VALIDATION';
      statusEl.textContent = 'Synthetic desktop test: WASD feet, Q/E head, J/K straights, L/; hooks, U/I uppercuts, O overhand. This does not verify phone motion.';
    }
    let unityInstance = null;
    let permissionStatus = 'PENDING';
    let orientationReceived = false;
    let latestOrientationPayload = '';
    let unityLoading = false;

    const buildUrl = 'Build';
    const productVersion = "w1-7c68a607ac4217e06d222fc75d2dd5e3c64ad178";
    const assetVersion = encodeURIComponent(productVersion || 'unknown');
    const versioned = (url) => `${url}?v=${assetVersion}`;
    const loaderUrl = versioned(buildUrl + '/boxer-round2.loader.js');
    const config = {
      dataUrl: versioned(buildUrl + '/boxer-round2.data'),
      // Full committed-source version in the URL: this payload never mutates.
      // Reload can use Unity's stored response without a conditional 304 fetch.
      cacheControl: (url) => new URL(url, document.baseURI).searchParams.get('v') === productVersion ? 'immutable' : 'no-store',
      frameworkUrl: versioned(buildUrl + '/boxer-round2.framework.js'),
      codeUrl: versioned(buildUrl + '/boxer-round2.wasm'),
      streamingAssetsUrl: 'StreamingAssets',
      companyName: "Boxer Research",
      productName: "Boxer P0",
      productVersion: productVersion,
    };

    function setStatus(text) {
      statusEl.textContent = text;
    }

    function send(method, payload) {
      if (unityInstance) unityInstance.SendMessage('P0 Systems', method, payload || '');
    }
    function sendRing(method, payload) {
      if (unityInstance) unityInstance.SendMessage('Boxer P0 Bootstrap', method, payload || '');
    }
    window.boxerRingMedia=createBoxerRingMedia({send:sendRing,version:productVersion});
    window.boxerProfileView=createBoxerProfileView({send:sendRing});

    function enterGame() {
      gate.classList.add('hidden');
      container.classList.remove('hidden');
      canvas.focus();
    }

    function onOrientation(event) {
      if (event.alpha == null && event.beta == null && event.gamma == null) return;
      orientationReceived = true;
      const a = Number(event.alpha || 0).toFixed(4);
      const b = Number(event.beta || 0).toFixed(4);
      const g = Number(event.gamma || 0).toFixed(4);
      latestOrientationPayload = `${a}|${b}|${g}`;
      send('BrowserSetOrientation', latestOrientationPayload);
    }

    async function requestMotionPermission() {
      if (!window.isSecureContext) return 'HTTPS REQUIRED';
      if (typeof DeviceOrientationEvent === 'undefined') return 'UNAVAILABLE';
      try {
        if (typeof DeviceOrientationEvent.requestPermission === 'function') {
          const result = await DeviceOrientationEvent.requestPermission();
          return result === 'granted' ? 'GRANTED' : 'DENIED';
        }
        return 'GRANTED';
      } catch (error) {
        console.error(error);
        return 'DENIED';
      }
    }

    function loadUnity() {
      if (unityLoading || unityInstance) return;
      unityLoading = true;
      container.classList.remove('hidden');
      const script = document.createElement('script');
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config).then(instance => {
          unityInstance = instance;
          if (desktopValidation) send('BrowserStartDesktopValidation', '');
          else send('BrowserSetMotionStatus', permissionStatus);
          if (latestOrientationPayload) send('BrowserSetOrientation', latestOrientationPayload);

          setStatus(orientationReceived
            ? `MOTION ACTIVE — build ${productVersion}`
            : `MOTION GRANTED — build ${productVersion}. Orientation may arrive later; touch gameplay is unlocked now.`);

          // P1 UAT startup rule: never keep the game behind a second orientation/calibration gate.
          enterGame();
          if (desktopValidation && new URLSearchParams(location.search).get('metrics') === '1') {
            const report = document.createElement('output');
            report.id = 'desktop-performance';
            report.style = 'position:fixed;left:4px;bottom:2px;color:#e8c773;font:10px monospace;pointer-events:none;z-index:9999';
            document.body.appendChild(report);
            let previous = performance.now(), count = 0, samples = [];
            function measure(now) {
              const dt=now-previous; previous=now;
              if (++count>120) samples.push(dt);
              if (samples.length>=600) {
                const sorted=[...samples].sort((a,b)=>a-b), mean=samples.reduce((a,b)=>a+b,0)/samples.length;
                report.textContent=JSON.stringify({mode:'DESKTOP_SYNTHETIC',build:productVersion,n:samples.length,fps:1000/mean,p95_ms:sorted[Math.floor(sorted.length*.95)],max_ms:sorted[sorted.length-1]});
                samples=[];
              }
              requestAnimationFrame(measure);
            }
            requestAnimationFrame(measure);
          }
        }).catch(message => {
          setStatus(`UNITY LOAD FAILED — build ${productVersion} — ${message}`);
          gate.classList.remove('hidden');
          container.classList.add('hidden');
          enableButton.disabled = false;
        });
      };
      script.onerror = () => {
        setStatus(`UNITY LOADER FAILED — build ${productVersion}`);
        enableButton.disabled = false;
      };
      document.body.appendChild(script);
    }

    enableButton.addEventListener('click', async () => {
      enableButton.disabled = true;
      // A failed media load will be shown/retried at Intro, not silently bypassed.
      window.boxerRingMedia.unlock().catch(error=>{console.warn('Ring media preparation:',String(error));});
      permissionStatus = desktopValidation ? "DESKTOP_SYNTHETIC" : await requestMotionPermission();
      setStatus('MOTION ' + permissionStatus + ' — build ' + productVersion);
      if (!desktopValidation && permissionStatus !== 'GRANTED') {
        enableButton.disabled = false;
        return;
      }

      window.addEventListener('deviceorientation', onOrientation, true);
      loadUnity();

      setTimeout(() => {
        if (!orientationReceived && !unityInstance) {
          setStatus('MOTION GRANTED — waiting for Unity. Orientation has not arrived yet — build ' + productVersion);
        }
      }, 2500);
    });

    document.addEventListener('touchmove', event => {
      if (!gate.contains(event.target) && !window.boxerProfileView.contains(event.target)) event.preventDefault();
    }, { passive: false });
    document.addEventListener('gesturestart', event => event.preventDefault(), { passive: false });
    document.addEventListener('gesturechange', event => event.preventDefault(), { passive: false });
  </script>
</body>
</html>
